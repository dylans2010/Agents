# XcodeGen project specification for the native macOS SwiftUI + AppKit Agents application.
name: Agents

options:
  bundleIdPrefix: com.apoorvdarshan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  CoincideRemoteKit:
    path: CoincideRemoteKit

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Agents:
    type: application
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    preBuildScripts:
      - name: Build Agents macOS Rust FFI
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export MACOSX_DEPLOYMENT_TARGET="26.0"
          if [ ! -f "${PROJECT_DIR}/Rust Backend/target/release/libcoincide_macos_ffi.a" ]; then
            echo "Building libcoincide_macos_ffi.a via cargo..."
            cd "${PROJECT_DIR}/Rust Backend"
            MACOSX_DEPLOYMENT_TARGET="26.0" cargo build --release -p coincide-macos-ffi
          fi
          if [ ! -f "${PROJECT_DIR}/Rust Backend/target/release/coincide-mcp-server" ]; then
            echo "Building coincide-mcp-server via cargo..."
            cd "${PROJECT_DIR}/Rust Backend"
            MACOSX_DEPLOYMENT_TARGET="26.0" cargo build --release -p coincide-mcp-server
          fi
    postBuildScripts:
      - name: Bundle coincide-mcp-server
        basedOnDependencyAnalysis: false
        script: |
          cp "${PROJECT_DIR}/Rust Backend/target/release/coincide-mcp-server" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/coincide-mcp-server"
          chmod +x "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/coincide-mcp-server"
    sources:
      - path: Agents
        excludes:
          - Info.plist
          - Agents.entitlements
    resources:
      - path: Agents/Resources/SystemAssets
    dependencies:
      - package: CoincideRemoteKit
    settings:
      base:
        PRODUCT_NAME: Agents
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Agents/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agents
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Agents connects to paired Coincide Remote devices over your local network.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Agents listens to the microphone only while you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Agents transcribes your dictation on this Mac using Apple Speech.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Agents sends Apple Events to open files and folders in your preferred editors and terminals.
        CODE_SIGN_ENTITLEMENTS: Agents/Agents.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Rust Backend/crates/coincide-macos-ffi/include"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/Rust Backend/target/release"
        OTHER_LDFLAGS: "-lcoincide_macos_ffi -framework Security -framework SystemConfiguration -framework CoreFoundation -framework IOKit -framework ApplicationServices -framework CoreGraphics -framework AppKit -framework Foundation -weak_framework ScreenCaptureKit -lproc -lc++ -liconv -lresolv"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  AgentsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentsTests
    dependencies:
      - target: Agents
      - package: CoincideRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Rust Backend/crates/coincide-macos-ffi/include"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agents.app/Contents/MacOS/Agents"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Agents:
    build:
      targets:
        Agents: all
        AgentsTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentsTests
    archive:
      config: Release
